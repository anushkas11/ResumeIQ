spring.application.name=resumeiq

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/resumeiq
spring.datasource.username=${Username}
spring.datasource.password=${Password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.format=json

# ---- Google OAuth2 login ----
# Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to register there:
#   http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${Google-ClientID}
spring.security.oauth2.client.registration.google.client-secret=${Google-Secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# After a successful Google login, the backend redirects the browser here with
# ?token=<jwt> attached. Point this at a route in your React app that reads
# the token from the URL, stores it, and redirects into the logged-in app.
app.oauth2.redirect-url=http://localhost:5173/oauth2/redirect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
