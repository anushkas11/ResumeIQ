spring.application.name=resumeiq

# Which profile runs by default if nothing else is set (local dev).
# Render/production will override this with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Database (MySQL) ----
# Local default works out of the box; production sets these three via env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resumeiq}
spring.datasource.username=${Username}
spring.datasource.password=${PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ---- Google OAuth2 login ----
# Create credentials at https://console.cloud.google.com/apis/credentials
# Register BOTH redirect URIs there (local + deployed):
#   http://localhost:8080/login/oauth2/code/google
#   https://<your-render-backend>.onrender.com/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${Google_ClientID}
spring.security.oauth2.client.registration.google.client-secret=${Google_Secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
